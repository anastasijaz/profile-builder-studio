# Supabase CLI config for running Melt's database locally (`npx supabase start`)
# and its tests (`npx supabase test db`). Requires Docker Desktop.
# If your CLI version complains about a key, run `npx supabase init --force`
# and copy the [auth] settings below into the generated file.
project_id = "melt"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Local inbox that catches magic-link emails: http://localhost:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_expiry = 3600
